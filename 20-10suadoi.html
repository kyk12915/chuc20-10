<meta charset="UTF-8">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
body {
  margin: 0;
  background: #ffd6e7;
  font-family: "Poppins", "Segoe UI", sans-serif;
  overflow-x: hidden;
  text-align: center;
}
h1 {
  color: #ff5ca2;
  margin-top: 20px;
  text-shadow: 2px 2px #fff;
  font-weight: 600;
}
.character {
  display: inline-block;
  margin: 10px;
  cursor: pointer;
  transition: transform 0.3s;
}
.character:hover { transform: scale(1.1); }
.character img {
  width: 100px; height: 100px;
  border-radius: 20px;
  border: 2px solid white;
  box-shadow: 0 4px 10px rgba(0,0,0,0.2);
}
.name {
  color: #b4004e;
  font-weight: 600;
  margin-top: 5px;
}
.gift {
  position: absolute;
  bottom: 50px;
  left: 50%;
  transform: translateX(-50%);
  width: 120px;
  cursor: pointer;
  display: none;
}
.card {
  display: none;
  position: fixed;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  background: #ffeaf4;
  border-radius: 20px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.2);
  padding: 20px;
  width: 300px;
  animation: pop 0.5s ease;
}
@keyframes pop {
  0% { transform: scale(0) translate(-50%, -50%); }
  100% { transform: scale(1) translate(-50%, -50%); }
}
.card img {
  width: 100%;
  border-radius: 10px;
  margin-top: 10px;
}
.close {
  margin-top: 10px;
  background: #ff7ab8;
  color: white;
  border: none;
  border-radius: 10px;
  padding: 8px 12px;
  cursor: pointer;
  font-weight: 600;
}
@media (max-width: 600px) {
  .character img { width: 80px; height: 80px; }
  .card { width: 90%; }
  h1 { font-size: 22px; }
  .name { font-size: 14px; }
}
</style>

<img class="gift" src="https://cdn-icons-png.flaticon.com/512/616/616408.png" id="gift">

<div class="card" id="card">
  <h2 id="cardName"></h2>
  <p id="cardMsg"></p>
  <img id="cardImg" src="">
  <button class="close" onclick="closeCard()">Đóng 💖</button>
</div>

<script>
const characters = document.querySelectorAll('.character');
const gift = document.getElementById('gift');
const card = document.getElementById('card');
const cardName = document.getElementById('cardName');
const cardMsg = document.getElementById('cardMsg');
const cardImg = document.getElementById('cardImg');

let selectedData = null;

characters.forEach(char => {
  char.addEventListener('click', () => {
    selectedData = {
      name: char.dataset.name,
      msg: char.dataset.msg,
      real: char.dataset.real
    };
    gift.style.display = 'block';
  });
});

gift.addEventListener('click', () => {
  if (!selectedData) return;
  cardName.textContent = selectedData.name;
  cardMsg.textContent = selectedData.msg;
  cardImg.src = selectedData.real;
  card.style.display = 'block';
});

function closeCard() {
  card.style.display = 'none';
}
</script>
